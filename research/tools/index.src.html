<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://api.hyperliquid.xyz wss://api.hyperliquid.xyz">
<title>Oazy Research</title>
<link rel="icon" href="icon.png">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/Inter-400.woff2) format("woff2");font-display:swap}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/Inter-500.woff2) format("woff2");font-display:swap}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/Inter-600.woff2) format("woff2");font-display:swap}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/Inter-700.woff2) format("woff2");font-display:swap}
@font-face{font-family:Outfit;font-weight:500;src:url(fonts/Outfit-500.woff2) format("woff2");font-display:swap}
@font-face{font-family:Outfit;font-weight:700;src:url(fonts/Outfit-700.woff2) format("woff2");font-display:swap}
@font-face{font-family:Outfit;font-weight:800;src:url(fonts/Outfit-800.woff2) format("woff2");font-display:swap}
:root{--bg:#07080d;--text:#f4f5f8;--dim:#a9adbd;--mute:#6d7286;--stroke:rgba(255,255,255,.09);--surf:rgba(255,255,255,.045);--surf2:rgba(255,255,255,.09);--up:#3ddc97;--dn:#ff5c7a;--warn:#ffb547;--a:#2fd6a8;--a2:#33a8ff;--ease:cubic-bezier(.16,1,.3,1);--back:cubic-bezier(.34,1.56,.64,1);--left:clamp(36px,4.4vw,64px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}html{background:var(--bg)}
body{font:500 15px/1.5 Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum","cv11";user-select:none}
button,input{font:inherit;color:inherit;border:0;background:none;outline:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:3px}
::selection{background:rgba(47,214,168,.4)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:transparent;border-radius:9px;border:2px solid transparent;background-clip:padding-box}:hover::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.16)}::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}::-webkit-scrollbar-track{background:none}
.d{font-family:Outfit,Inter,sans-serif}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mute)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2}

#boot{position:fixed;inset:0;z-index:90;background:#07080d;display:grid;place-content:center;justify-items:center;gap:20px;pointer-events:none;transition:opacity .7s ease,transform .9s var(--ease)}
#boot img{width:92px;height:92px;animation:orbin 1.1s var(--ease) both;filter:drop-shadow(0 0 34px rgba(47,214,168,.55))}
#boot div{display:flex;align-items:baseline;gap:12px;animation:fd 1s .25s var(--ease) both}#boot b{font:800 24px Outfit,sans-serif;letter-spacing:.22em}#boot i{font:500 15px Outfit,sans-serif;letter-spacing:.3em;color:var(--dim)}
@keyframes orbin{from{opacity:0;transform:scale(.72)}}
body.ready #boot{opacity:0;transform:scale(1.03)}
body:not(.ready) #top,body:not(.ready) #rail{opacity:0}#top,#rail{transition:opacity .8s ease .15s}
/* top bar */
#top{position:fixed;left:0;right:0;top:0;height:76px;display:flex;align-items:center;padding:0 14px 0 var(--left);gap:6px;z-index:30;-webkit-app-region:drag}
#top button{-webkit-app-region:no-drag}
.brand{display:flex;align-items:center;gap:12px;margin-right:38px}
.brand img{width:30px;height:30px;display:block}
.brand b{font:800 20px Outfit,sans-serif;letter-spacing:.2em}.brand i{font:500 12.5px Outfit,sans-serif;letter-spacing:.26em;color:var(--dim);margin-left:-3px}
.tabs{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.04);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(255,255,255,.05);-webkit-app-region:no-drag}
.tabs button{position:relative;z-index:1;height:36px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--dim);transition:color .25s}
.tabs button:hover,.tabs button.on{color:#fff}
.pill{position:absolute;top:4px;height:36px;border-radius:999px;background:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);transition:left .5s var(--ease),width .5s var(--ease)}
.grow{flex:1}
.status{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--dim);padding:0 12px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--mute);transition:background .4s}
.status i.live{background:var(--up);box-shadow:0 0 10px var(--up)}.status i.warn{background:var(--warn)}
.clock{font-weight:600;font-size:15px;padding:0 10px;min-width:62px;text-align:center}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--dim);position:relative;transition:background .2s,color .2s,transform .4s var(--back)}
.icon:hover{background:rgba(255,255,255,.1);color:#fff;transform:scale(1.08)}
.icon:active{transform:scale(.94)}
.icon svg{width:18px;height:18px}
.count{position:absolute;right:4px;top:4px;min-width:15px;height:15px;padding:0 4px;border-radius:9px;background:var(--warn);color:#14100a;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.sep{width:1px;height:22px;background:rgba(255,255,255,.1);margin:0 8px}
.win{width:38px;height:38px;border-radius:10px}.win:hover{transform:none}.win.x:hover{background:#e0405e}
.nowin .win,.nowin .sep{display:none}

/* portfolio switcher: Oazy Research holds several portfolios */
.pf{height:38px;display:flex;align-items:center;gap:9px;padding:0 12px 0 5px;margin:0 26px 0 -16px;border-radius:999px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);font-weight:600;font-size:13.5px;color:#fff;white-space:nowrap;transition:background .2s,transform .35s var(--back);-webkit-app-region:no-drag}
.pf:hover{background:rgba(255,255,255,.11)}.pf:active{transform:scale(.96)}
.pfi{width:28px;height:28px;border-radius:50%;flex:none;display:block;overflow:hidden}.pfi svg,.pfi img{width:100%;height:100%;display:block}
.pfi.core{background:radial-gradient(circle at 50% 45%,#0f2a2a,#07080d 75%)}
.pf .chev{width:14px;height:14px;color:var(--dim);transition:transform .35s var(--ease)}.pf.open .chev{transform:rotate(180deg)}
.pfm{position:fixed;top:68px;width:360px;padding:8px;z-index:41;background:rgba(16,17,26,.97);border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 40px 80px -30px #000;display:none}
.pfm.on{display:block;animation:shin .4s var(--ease)}
.pfm h5{font-size:10.5px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.45);padding:8px 12px 6px;text-transform:uppercase}
.pfo{display:flex;align-items:center;gap:14px;width:100%;padding:10px 12px;border-radius:15px;text-align:left;transition:background .2s}
.pfo:hover{background:rgba(255,255,255,.065)}.pfo .pfi{width:44px;height:44px}
.pfo div{flex:1;min-width:0}.pfo b{display:block;font:700 16px/1.2 Outfit,sans-serif}.pfo small{display:block;color:var(--mute);font-size:12.5px}
.pfo .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#f4f5f8;color:#0b0c12;opacity:0;flex:none}.pfo.on .ck{opacity:1}.pfo .ck svg{width:13px;height:13px}
.nowin .pf,.nowin .pfm{display:none}

/* pages */
.page{position:fixed;inset:0;display:none}
.page.on{display:block;animation:pin .7s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(14px)}}
.wrap{position:absolute;left:var(--left);right:var(--left);top:92px;bottom:28px;display:flex;flex-direction:column;min-height:0}
h2{font:800 clamp(34px,4.2vw,56px)/1 Outfit,sans-serif;letter-spacing:-.015em}
.lede{color:var(--dim);font-size:15.5px;margin-top:8px}
.kick{font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.022) 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 0 0 1px rgba(255,255,255,.05),0 30px 60px -36px rgba(0,0,0,.85);border-radius:22px;backdrop-filter:blur(22px) saturate(140%)}
.chips{display:flex;gap:6px;align-items:center}
.chip{height:34px;padding:0 15px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--dim);background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);transition:background .2s,color .2s,transform .35s var(--back)}
.chip:hover{color:#fff;background:rgba(255,255,255,.12);transform:scale(1.03)}
.chip.on{background:#f4f5f8;color:#0b0c12;box-shadow:none}
.btn{height:44px;padding:0 22px;white-space:nowrap;border-radius:999px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;gap:10px;transition:transform .4s var(--back),box-shadow .3s,background .2s}
.btn.pri{background:#f4f5f8;color:#0b0c12}.btn.pri:hover{background:#fff;transform:scale(1.05);box-shadow:0 0 28px rgba(255,255,255,.22)}
.btn.gh{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.btn.gh:hover{background:rgba(255,255,255,.15);transform:scale(1.05)}
.btn:active{transform:scale(.96)}

/* logo marks */
.lg{--s:40px;width:var(--s);height:var(--s);flex:none;border-radius:calc(var(--s)*.28);background:#fff;display:grid;place-items:center;overflow:hidden}
.lg img{width:66%;height:66%;object-fit:contain;display:block}
.lg.gy,.lg.tx{background:linear-gradient(145deg,var(--b),color-mix(in oklab,var(--b) 45%,#07080d));color:#fff}
.lg.gy svg{width:56%;height:56%}
.lg.tx{font:800 calc(var(--s)*.31) Outfit,sans-serif;letter-spacing:-.02em}

/* home */
#hero{position:absolute;inset:0;z-index:0}
#heroC{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .25s}
#rail{position:absolute;left:0;right:0;top:76px;height:164px;z-index:3;pointer-events:none}
.tile{position:absolute;top:16px;left:0;width:var(--f,152px);height:var(--f,152px);pointer-events:auto;transform-origin:0 0;will-change:transform,opacity;touch-action:none}
.tface{position:absolute;inset:0;border-radius:15.5%;overflow:hidden;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.1);transition:box-shadow .22s}
.tface img{display:block;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.tface.core{background:radial-gradient(circle at 50% 45%,#0f2a2a,#07080d 75%)}.tface.core img{width:100%;height:100%}
.tface.gl{background:linear-gradient(145deg,var(--b),color-mix(in oklab,var(--b) 55%,#07080d));color:#fff}.tface.gl svg{width:58%;height:58%}.tface.gl b{font:800 calc(var(--f,152px)*.27) Outfit,sans-serif;letter-spacing:-.02em}
.tile:hover .tface{box-shadow:0 0 0 2px rgba(255,255,255,.45)}
.tile.on .tface{box-shadow:0 0 0 3px #fff,0 18px 50px -8px color-mix(in oklab,var(--a) 75%,transparent)}
.tile.shine .tface::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);background-size:260% 100%;animation:sweep .9s var(--ease) both;pointer-events:none}
@keyframes sweep{from{background-position:120% 0}to{background-position:-60% 0}}
.tile .tchg{position:absolute;left:0;right:0;top:calc(100% + 7px);text-align:center;font-size:15px;font-weight:600;pointer-events:none}
#stage{position:absolute;left:0;right:0;bottom:0;top:240px;display:flex;flex-direction:column;z-index:2}
#info{flex:none;display:flex;justify-content:space-between;align-items:flex-end;gap:clamp(20px,3vw,48px);padding:0 var(--left)}
#info .lead{min-width:0;flex:1}
#info .right{flex:none;display:flex;align-items:center;gap:clamp(16px,2.2vw,32px);padding-bottom:6px}
#heroWrap{position:relative;flex:1;min-height:0;margin-top:clamp(8px,1.8vh,20px)}
.cap{position:absolute;left:var(--left);top:4px;z-index:2;pointer-events:none;display:flex;align-items:baseline;gap:10px;height:32px}
.cap b{font:700 clamp(17px,1.5vw,21px)/1 Outfit,sans-serif}.cap span{color:rgba(255,255,255,.48);font-size:13px;font-weight:500}
.pulse{position:absolute;display:none;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff;box-shadow:0 0 14px 2px rgba(255,255,255,.75);pointer-events:none;z-index:1}
.pulse::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);animation:beat 2.6s var(--ease) infinite}
@keyframes beat{from{transform:scale(1);opacity:.9}to{transform:scale(5.2);opacity:0}}
.kicker{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tag{height:25px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;background:rgba(255,255,255,.11);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);font-size:12.5px;font-weight:700;color:rgba(255,255,255,.92)}
.kicker small{color:rgba(255,255,255,.55);font-size:13px}
#title{font:800 clamp(38px,5vw,72px)/1 Outfit,sans-serif;letter-spacing:-.022em}
#title.long{font-size:clamp(30px,3.5vw,50px);line-height:1.04}
.fade{animation:fd .6s var(--ease)}
@keyframes fd{from{opacity:0;transform:translateY(12px)}}
#stats{display:flex;gap:0}
.st{padding:0 clamp(12px,1.5vw,24px);border-left:1px solid rgba(255,255,255,.08)}.st:first-child{border:0;padding-left:0}.st:last-child{padding-right:0}
.st span{display:block;color:rgba(255,255,255,.55);font-size:12.5px;font-weight:600;white-space:nowrap}
.st b{font:700 clamp(17px,1.65vw,24px)/1.25 Outfit,sans-serif;white-space:nowrap}
.acts{display:flex;gap:12px;align-items:center}
#ranges{position:absolute;right:var(--left);top:0;z-index:3}
#hints{position:absolute;right:var(--left);bottom:10px;z-index:3;pointer-events:none;color:rgba(255,255,255,.28);font-size:11.5px;word-spacing:1px;white-space:nowrap}
.tip{position:fixed;z-index:20;pointer-events:none;padding:6px 11px;border-radius:10px;background:rgba(14,15,24,.94);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:12px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .12s;transform:translate(-50%,-135%)}
.empty{position:absolute;left:var(--left);top:42%;max-width:560px;z-index:3}

/* holdings */
.tools{display:flex;align-items:flex-end;gap:14px;flex:none;margin-bottom:20px;flex-wrap:wrap}
.search{height:34px;width:210px;border-radius:999px;background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);padding:0 15px;font-size:13.5px;user-select:text}
.search:focus{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);background:rgba(255,255,255,.09)}
.search::placeholder{color:var(--mute)}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));grid-auto-rows:148px;gap:14px;padding:4px 6px 14px 4px;align-content:start}
.card{position:relative;padding:17px 18px 15px;text-align:left;border-radius:20px;overflow:hidden;background:linear-gradient(155deg,color-mix(in oklab,var(--b) 16%,rgba(255,255,255,.05)),rgba(255,255,255,.018) 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.05);transition:transform .45s var(--back),box-shadow .3s;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%}
.card:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.2),0 26px 46px -24px color-mix(in oklab,var(--b) 55%,#000)}
.card .h{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.card .h div{min-width:0;flex:1}.card b{font:700 17px/1.2 Outfit,sans-serif;display:block}.card small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pct{font:700 18px Outfit,sans-serif;white-space:nowrap}
.card .sp{position:absolute;left:0;right:0;bottom:38px;height:40px;opacity:.7;pointer-events:none}
.card .f{position:absolute;left:18px;right:18px;bottom:12px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim)}

/* performance */
.perfTop{display:flex;align-items:flex-end;gap:clamp(24px,4vw,60px);flex:none;flex-wrap:wrap}
.perfTop h2{font-size:clamp(40px,5vw,72px);letter-spacing:-.022em}.perfTop .st{border:0;padding:0}
#perfBig{flex:1;min-height:0;position:relative;margin:8px calc(var(--left)*-1) 12px}
#perfBig canvas,#heroC{display:block}
#perfBig canvas{position:absolute;inset:0;width:100%;height:100%}
.trio{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:14px;flex:none;height:min(24vh,186px)}
.mini{padding:13px 20px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.mini h4{font-size:11px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.5);margin-bottom:8px;text-transform:uppercase;flex:none}
.rw{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:14px;flex:none;width:100%;text-align:left;border-radius:8px;transition:transform .3s var(--ease)}
button.rw:hover{transform:translateX(3px)}
.rw .lg{--s:24px}.rw b{font-weight:600}.rw em{margin-left:auto;font-style:normal;font-weight:600;white-space:nowrap}
.alloc{display:flex;align-items:center;gap:20px;flex:1;min-height:0}
.ring{height:100%;max-height:112px;aspect-ratio:1;flex:none;position:relative}.ring svg{width:100%;height:100%;display:block;overflow:visible}.ring path{transition:stroke-dashoffset 1.6s var(--ease)}
.lgnd{flex:1;min-width:0}.lgnd .rw{padding:3px 0}.dotc{width:8px;height:8px;border-radius:50%;flex:none}

/* market */
.mkt{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(24px,4vw,56px);margin-top:20px}
.board{min-height:0;overflow:auto;padding:6px 8px 6px 2px}
.mr{display:grid;grid-template-columns:128px 1fr 76px;align-items:center;gap:14px;height:clamp(30px,4.6vh,40px);font-size:14px;font-weight:600}
.mr .bar{position:relative;height:6px;border-radius:9px;background:rgba(255,255,255,.055)}
.mr .bar::before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:1px;background:rgba(255,255,255,.14)}
.mr .bar i{position:absolute;top:0;bottom:0;border-radius:9px;transition:width .9s var(--ease)}
.mr .bar i.p{left:50%;background:linear-gradient(90deg,rgba(61,220,151,.25),var(--up))}.mr .bar i.n{right:50%;background:linear-gradient(270deg,rgba(255,92,122,.25),var(--dn))}
.mr em{font-style:normal;text-align:right}
.side{min-height:0;overflow:auto;padding-right:6px}
.reg{display:grid;grid-template-columns:1fr 1fr;gap:16px 26px;margin:14px 0 30px}
.reg b{font:700 clamp(22px,2.3vw,31px)/1.1 Outfit,sans-serif;display:block}.reg span{color:var(--mute);font-size:12.5px;display:block}.reg small{color:var(--dim);font-size:12.5px;display:block}
.act{padding:11px 0;border-top:1px solid rgba(255,255,255,.075);font-size:14px;color:var(--dim)}.act b{display:block;color:#fff;font-weight:600;font-size:13px;margin-bottom:1px}

/* outlook */
.count-hero{display:flex;align-items:center;gap:30px;padding:clamp(18px,3vh,30px) clamp(22px,3vw,38px);flex:none;flex-wrap:wrap}
.count-hero h2{font-size:clamp(30px,3.6vw,50px)}
.clockx{display:flex;gap:8px;margin-left:auto}
.clockx div{width:clamp(66px,6vw,84px);padding:10px 0 8px;border-radius:16px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);text-align:center}
.clockx b{display:block;font:700 clamp(24px,2.5vw,34px)/1.1 Outfit,sans-serif}.clockx span{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--mute)}
.two{flex:1;min-height:0;display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,4vw,56px);margin-top:20px}
.col{min-height:0;display:flex;flex-direction:column}
.col>.list{flex:1;min-height:0;overflow:auto;margin-top:8px;padding-right:6px}
.ev{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
.ev:first-child{border:0}
.ev .dt{font:700 14px Outfit,sans-serif;color:#fff}.ev.big .dt{color:var(--warn)}

<script>
/*@@PLAN*/

/* ── Helpers ─────────────────────────────────────────────────────────────── */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const API='https://api.hyperliquid.xyz/info',H=PLAN.H,byT=Object.fromEntries([...H,...PLAN.benchList].map(h=>[h.t,h])),byM=Object.fromEntries(H.map(h=>[h.m,h]));
const num=v=>v!=null&&Number.isFinite(v);
const GY={chip:'<rect x="6" y="6" width="12" height="12" rx="2.5"/><path d="M9 2.5V6M15 2.5V6M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"/>',flame:'<path d="M12 2.5c.8 3.2 5.5 5.6 5.5 11a5.5 5.5 0 0 1-11 0c0-3 1.6-4.6 2.4-6.7.9 1.2 1.5 2.6 1.6 4.2 1.3-2.3 1.9-5.3 1.5-8.5z"/>',drop:'<path d="M12 2.8s6.5 7 6.5 11.7a6.5 6.5 0 0 1-13 0C5.5 9.8 12 2.8 12 2.8z"/>',columns:'<path d="M3 9l9-5.5L21 9M5 9.5v8M9.7 9.5v8M14.3 9.5v8M19 9.5v8M3 20.5h18"/>',helix:'<path d="M7 2.5c0 7 10 7 10 14.5M17 2.5c0 7-10 7-10 14.5M7 21.5c0-1.6.5-3 1.4-4.2M17 21.5c0-1.6-.5-3-1.4-4.2M8.5 6.5h7M8.5 13h7M9 19h6"/>'};
const IC={bell:'<path d="M6 9.5a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4s2-1.5 2-6.5z"/><path d="M10 20a2 2 0 0 0 4 0"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',min:'<path d="M6 12h12"/>',max:'<rect x="6.5" y="6.5" width="11" height="11" rx="2"/>',x:'<path d="M7 7l10 10M17 7L7 17"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};
const svg=(p,w=1.8)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
function mark(t,s=40){const h=byT[t];if(!h)return`<span class="lg tx" style="--s:${s}px;--b:#343a55">${esc(String(t).slice(0,3))}</span>`;
 if(h.lo)return`<span class="lg" style="--s:${s}px"><img src="logos/${h.lo}" alt="" data-fb="${h.t}"></span>`;
 if(h.gy)return`<span class="lg gy" style="--s:${s}px;--b:${h.b}">${svg(GY[h.gy])}</span>`;
 return`<span class="lg tx" style="--s:${s}px;--b:${h.b}">${h.tx||h.t.slice(0,3)}</span>`}
document.addEventListener('error',e=>{const i=e.target;if(i.tagName==='IMG'&&i.dataset.fb){const p=i.parentNode;const h=byT[i.dataset.fb];p.className='lg tx';p.style.setProperty('--b',h?h.b:'#343a55');p.textContent=i.dataset.fb.slice(0,3)}},true);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fpx=v=>!num(v)?'—':v>=1000?v.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}):v>=100?v.toFixed(2):v>=10?v.toFixed(3):v.toFixed(4);
const fusd=(v,d=2)=>!num(v)?'—':(v<0?'−$':'$')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fsgn=(v,d=2)=>!num(v)?'—':(v>=-(.5/10**d)?'+$':'−$')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fpct=(v,d=2)=>!num(v)?'—':(v>=-(.5/10**d)?'+':'−')+Math.abs(v).toFixed(d)+'%';
const cls=v=>!num(v)?'mu':v>=0?'up':'dn';
const LS={get(k,ttl){try{const o=JSON.parse(localStorage.getItem('pz3:'+k));if(!o||(ttl&&Date.now()-o.t>ttl))return null;return o.d}catch{return null}},set(k,d){try{localStorage.setItem('pz3:'+k,JSON.stringify({t:Date.now(),d}))}catch{}}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
const short=a=>a.slice(0,6)+'…'+a.slice(-4);
const startLabel=new Date(PLAN.t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC',hour12:false})+' UTC';

/* ── State ───────────────────────────────────────────────────────────────── */
const S={px:{},prev:{},ctx:{},daily:{},curve:{},fund:{},pos:{},loaded:false,err:false,ws:false,lastTick:0,page:'home',sel:'CORE',range:'1M',role:'All',q:'',period:30,address:LS.get('addr')||PLAN.address};
const P=h=>S.px[h.m];
const ch24=m=>{const p=S.px[m],q=S.prev[m];return p&&q?(p/q-1)*100:null};
function chgN(m,n){const d=S.daily[m],p=S.px[m];if(!d||!p||!d.length)return null;const t=Date.now()-n*864e5;if(d[0][0]>t)return null;let c=d[0][1];for(const x of d){if(x[0]>t)break;c=x[1]}return(p/c-1)*100}
function sma(m,n){const d=S.daily[m];if(!d||d.length<n)return null;let a=0;for(let i=d.length-n;i<d.length;i++)a+=d[i][1];return a/n}
function calc(h){const q=S.pos[h.m];if(!q)return null;const px=P(h)||q.mark,val=q.szi*px,cost=q.szi*q.entry,upnl=q.szi*(px-q.entry);return{...q,px,val,cost,upnl,total:upnl+q.real-q.fees+q.fund,pct:cost?upnl/cost*100:null}}
const held=()=>H.filter(h=>S.pos[h.m]);
function K(){const L=held().map(h=>({h,c:calc(h)}));const value=L.reduce((a,x)=>a+x.c.val,0),cost=L.reduce((a,x)=>a+x.c.cost,0),total=L.reduce((a,x)=>a+x.c.total,0),gross=L.reduce((a,x)=>a+x.c.upnl+x.c.real,0);
 const b=m=>S.px[m]?(S.px[m]/PLAN.bench[m]-1)*100:null;const sp=b('xyz:SP500'),nd=b('xyz:XYZ100'),ret=cost?total/cost*100:null;
 const role=r=>L.filter(x=>x.h.role===r).reduce((a,x)=>a+x.c.val,0);let day=0;L.forEach(x=>day+=x.c.val*(ch24(x.h.m)||0));
 return{L,n:L.length,value,cost,total,gross,ret,sp,nd,day:value?day/value:null,ai:role('AI'),regime:role('Regime'),hedge:role('Hedge'),ready:S.loaded&&L.length>0}}
const order=()=>held().sort((a,b)=>calc(b).val-calc(a).val);

/* ── Network: a weighted queue keeps us inside the 1200 weight/min API limit ─ */
const Q=[],spent=[];let qBusy=false;
function used(){const n=Date.now();while(spent.length&&n-spent[0][0]>60000)spent.shift();return spent.reduce((a,x)=>a+x[1],0)}
function post(body,{w=2,pri=false}={}){return new Promise((res,rej)=>{const j={body,w,pri,res,rej,tries:0};pri?Q.unshift(j):Q.push(j);pump()})}
async function pump(){if(qBusy)return;qBusy=true;while(Q.length){const j=Q[0];if(used()+j.w>(j.pri?1050:750)){await wait(400);continue}Q.shift();spent.push([Date.now(),j.w]);const ac=new AbortController(),to=setTimeout(()=>ac.abort(),15000);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(j.body),signal:ac.signal});if(r.status===429&&++j.tries<5){clearTimeout(to);Q.unshift(j);await wait(6000);continue}if(!r.ok)throw new Error('HTTP '+r.status);j.res(await r.json())}catch(e){j.rej(e)}clearTimeout(to);await wait(40)}qBusy=false}
async function loadMeta(){for(const d of['xyz','para']){const[m,c]=await post({type:'metaAndAssetCtxs',dex:d},{w:20,pri:true});m.universe.forEach((u,i)=>{const x=c[i];if(!x)return;S.ctx[u.name]=x;if(x.markPx&&!S.ws)S.px[u.name]=+x.markPx;else if(x.markPx&&!(u.name in S.px))S.px[u.name]=+x.markPx;if(x.prevDayPx)S.prev[u.name]=+x.prevDayPx})}const m=await post({type:'allMids'},{w:2}).catch(()=>null);if(m&&m.BTC&&!S.px.BTC)S.px.BTC=+m.BTC;S.lastTick=Date.now()}
let wsObj=null;
function connectWS(){try{wsObj=new WebSocket('wss://api.hyperliquid.xyz/ws')}catch{setTimeout(connectWS,5000);return}const ws=wsObj;
 ws.onopen=()=>{S.ws=true;setStatus();['','xyz','para'].forEach(d=>ws.send(JSON.stringify({method:'subscribe',subscription:d?{type:'allMids',dex:d}:{type:'allMids'}})));ws.send(JSON.stringify({method:'subscribe',subscription:{type:'userFills',user:S.address}}))};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.channel==='allMids'){const mids=m.data.mids,d=m.data.dex;for(const k in mids)S.px[(d&&!k.includes(':'))?d+':'+k:k]=+mids[k];S.lastTick=Date.now()}else if(m.channel==='userFills'&&m.data&&!m.data.isSnapshot){pollPos();toast('New fill. Updating positions.')}};
 ws.onclose=()=>{S.ws=false;setStatus();setTimeout(connectWS,4000)};ws.onerror=()=>{try{ws.close()}catch{}}}
async function pollPos(){if(pollPos.busy)return;pollPos.busy=true;const A=S.address;try{const pos={};for(const d of['xyz','para']){const r=await post({type:'clearinghouseState',user:A,dex:d},{w:2,pri:true});(r.assetPositions||[]).forEach(p=>{const x=p.position,key=x.coin.includes(':')?x.coin:d+':'+x.coin;if(!byM[key]||!+x.szi)return;pos[key]={szi:+x.szi,entry:+x.entryPx,mark:+x.positionValue/(+x.szi||1),lev:x.leverage,fund:x.cumFunding?-(+x.cumFunding.sinceOpen):0,real:0,fees:0,fl:[]}})}
  const f=await post({type:'userFills',user:A,aggregateByTime:true},{w:20});(f||[]).forEach(x=>{if(x.time<PLAN.t)return;const q=pos[x.coin];if(!q)return;q.real+=+x.closedPnl;q.fees+=+x.fee;q.fl.push({t:x.time,buy:x.side==='B',sz:+x.sz,px:+x.px})});
  const was=held().map(h=>h.t).join();S.pos=pos;S.loaded=true;S.err=false;if(held().map(h=>h.t).join()!==was)structure()}catch{S.err=true}pollPos.busy=false;setStatus();live()}
async function loadDaily(m){if(S.daily[m])return S.daily[m];const c=LS.get('d:'+m,20*60e3);if(c){S.daily[m]=c;return c}const n=Date.now(),r=await post({type:'candleSnapshot',req:{coin:m,interval:'1d',startTime:n-190*864e5,endTime:n}},{w:24});S.daily[m]=r.map(x=>[x.t,+x.c]);LS.set('d:'+m,S.daily[m]);return S.daily[m]}
async function loadCurve(){const el=Date.now()-PLAN.t,iv=el<=2*864e5?'5m':el<=20*864e5?'1h':'4h',ms={'5m':3e5,'1h':36e5,'4h':144e5}[iv];const ms_=[...held().map(h=>h.m),'xyz:SP500','xyz:XYZ100'],key=m=>'c:'+iv+':'+m;ms_.forEach(m=>{const c=LS.get(key(m));if(c)S.curve[m]=c});paintHero();drawPerf();for(const m of ms_){if(LS.get(key(m),4*60e3))continue;const r=await post({type:'candleSnapshot',req:{coin:m,interval:iv,startTime:PLAN.t-ms,endTime:Date.now()}},{w:21});const c=r.map(x=>[x.T||x.t+ms,+x.c]);LS.set(key(m),c);S.curve[m]=c}paintHero();drawPerf()}
async function loadFund(m){const c=LS.get('f:'+m,36e5);if(c!=null){S.fund[m]=c;return}const r=await post({type:'fundingHistory',coin:m,startTime:Date.now()-14*864e5},{w:21});if(r.length){S.fund[m]=r.reduce((a,x)=>a+ +x.fundingRate,0)/r.length*876000;LS.set('f:'+m,S.fund[m])}}
async function background(){await loadCurve().catch(()=>{});for(const h of held()){await loadDaily(h.m).catch(()=>{});sparks(h.m)}for(const h of held())await loadFund(h.m).catch(()=>{});renderSignals()}

 ts.forEach(t=>{let pnl=0,cost=0;L.forEach(h=>{const s=st[h.m],c=S.curve[h.m];while(s.ci<c.length&&c[s.ci][0]<=t)s.last=c[s.ci++][1];while(s.fi<s.fl.length&&s.fl[s.fi].t<=t){const x=s.fl[s.fi++];if(x.buy){s.avg=(s.sz*s.avg+x.sz*x.px)/(s.sz+x.sz);s.sz+=x.sz}else{s.real+=(x.px-s.avg)*x.sz;s.sz=Math.max(0,s.sz-x.sz)}}pnl+=s.real+s.sz*((s.last??s.avg)-s.avg);cost+=s.sz*s.avg});if(cost>0)pts.push([t,pnl/cost*100]);while(ia<A.length&&A[ia][0]<=t)la=A[ia++][1];while(ib<B.length&&B[ib][0]<=t)lb=B[ib++][1];if(la)sp.push([t,(la/PLAN.bench['xyz:SP500']-1)*100]);if(lb)nd.push([t,(lb/PLAN.bench['xyz:XYZ100']-1)*100])});
 const k=K(),n=Date.now();if(k.ready&&k.cost){pts.push([n,k.gross/k.cost*100]);if(num(k.sp))sp.push([n,k.sp]);if(num(k.nd))nd.push([n,k.nd])}return[{name:'Core',p:pts,c:'#ffffff',fill:'#7c6cff',glow:'rgba(160,150,255,.6)',lw:2.2},{name:'S&P',p:sp,c:'#ffb547',lw:1.3},{name:'Nasdaq',p:nd,c:'#a99bff',lw:1.3}]}

/* ── Market ──────────────────────────────────────────────────────────────── */
function renderMkt(){$('#mktLede').textContent='Live across asset classes';$('#perChips').innerHTML=[[30,'1M'],[90,'3M'],[180,'6M']].map(p=>`<button class="chip ${p[0]===S.period?'on':''}" data-p="${p[0]}">${p[1]}</button>`).join('');$('#regKick').textContent='Regime · my read, '+PLAN.asOf;$('#reg').innerHTML=PLAN.gauges.map(g=>`<div><span>${g[0]}</span><b style="color:${g[4]}">${g[2]}</b><small>${g[3]}</small></div>`).join('');$('#story').innerHTML=PLAN.acts.map(a=>`<div class="act"><b>${a[0]}</b>${a[1]}</div>`).join('');paintBoard();if(!renderMkt.loaded){renderMkt.loaded=true;(async()=>{for(const a of PLAN.assets){await loadDaily(a[1]).catch(()=>{});if(S.page==='mkt')paintBoard()}})()}}
function paintBoard(){const rows=PLAN.assets.map(a=>({n:a[0],v:chgN(a[1],S.period),l:!!S.daily[a[1]]})).sort((a,b)=>(b.v??-1e9)-(a.v??-1e9)),mx=Math.max(1,...rows.map(r=>Math.abs(r.v||0)));$('#board').innerHTML=rows.map(r=>`<div class="mr"><span>${r.n}</span><div class="bar">${num(r.v)?`<i class="${r.v>=0?'p':'n'}" style="width:${Math.abs(r.v)/mx*50}%"></i>`:''}</div><em class="${cls(r.v)}">${num(r.v)?fpct(r.v,1):r.l?'n/a':'…'}</em></div>`).join('')}
$('#perChips').onclick=e=>{const b=e.target.closest('[data-p]');if(b){S.period=+b.dataset.p;$$('#perChips .chip').forEach(x=>x.classList.toggle('on',x===b));paintBoard()}};

/* ── Outlook ─────────────────────────────────────────────────────────────── */
const evTime=c=>new Date(c[0]+'T21:00:00Z').getTime();
function nextBig(){const n=Date.now();return PLAN.cats.find(c=>c[5]&&evTime(c)>n)||PLAN.cats.find(c=>evTime(c)>n)||null}
function renderNext(){const nx=nextBig();$('#cHero').innerHTML=nx?`<div><span class="kick">Next full re-rank</span><h2 style="margin-top:8px">${esc(nx[2])}</h2><p class="lede">${esc(nx[1])} · ${esc(nx[3])}</p></div><div class="clockx" id="cd"></div>`:`<div><span class="kick">Calendar</span><h2 style="margin-top:8px">Nothing scheduled</h2></div>`;tickCD();const n=Date.now(),up=PLAN.cats.filter(c=>evTime(c)>n);$('#cal').innerHTML=up.map(c=>{const d=Math.round((evTime(c)-n)/864e5);return`<div class="ev ${c[5]?'big':''}"><span class="dt">${esc(c[1])}</span><div><b>${esc(c[2])}</b><small>${esc(c[3])}</small></div><em>${d<=1?'Next 24h':d+' days'}</em></div>`}).join('')||'<p class="lede">Nothing scheduled.</p>';$('#deck').innerHTML=[...PLAN.benchList].sort((a,b)=>b.s-a.s).map(b=>`<div class="bn">${mark(b.t,32)}<div><b>${b.t}</b><small>${esc(b.e)}</small></div><em>${b.s.toFixed(2)}</em></div>`).join('')}
function tickCD(){const e=$('#cd');if(!e)return;const nx=nextBig();if(!nx)return;const s=Math.max(0,Math.floor((evTime(nx)-Date.now())/1000)),u=[[Math.floor(s/86400),'DAYS'],[Math.floor(s%86400/3600),'HRS'],[Math.floor(s%3600/60),'MIN'],[s%60,'SEC']];e.innerHTML=u.map(x=>`<div><b>${String(x[0]).padStart(2,'0')}</b><span>${x[1]}</span></div>`).join('')}
$('#rulesBtn').onclick=()=>openSheet(`<div class="shead"><div><h3>Rotation rules</h3><small>The question at every review: is something clearly better?</small></div><button class="icon" data-close aria-label="Close">${svg(IC.x)}</button></div>${PLAN.rules.map(r=>`<div class="rl"><b>${esc(r[0])}</b>${esc(r[1])}</div>`).join('')}`);

/* ── Sheets and popovers ─────────────────────────────────────────────────── */
function openSheet(html){$('#sheet').innerHTML=html;$('#ov').classList.add('on');const f=$('#sheet [data-close]');if(f)f.focus()}
function closeSheet(){const o=$('#ov');if(!o.classList.contains('on'))return false;o.classList.remove('on');if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();return true}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'||e.target.closest('[data-close]'))closeSheet()});
function details(t){const h=byT[t];if(!h||!h.f)return;const c=calc(h);if(!c)return;const f14=S.fund[h.m],s50=sma(h.m,50),ctx=S.ctx[h.m];const nums=[['Value',fusd(c.val)],['Size',String(c.szi)],['Avg entry',fpx(c.entry)],['Fees paid',fusd(c.fees,3)],['Funding net',fsgn(c.fund,3)],['Funding 14d',num(f14)?f14.toFixed(1)+'% APR':'…'],['vs 50-day',s50&&P(h)?fpct((P(h)/s50-1)*100,1):'…'],['30 days',num(chgN(h.m,30))?fpct(chgN(h.m,30),1):'…'],['Leverage',c.lev?c.lev.value+'x '+c.lev.type:'—'],['24h volume',ctx?'$'+Math.round(+ctx.dayNtlVlm).toLocaleString('en-US'):'—']];
 openSheet(`<div class="shead">${mark(t,56)}<div><h3>${esc(h.n)}</h3><small>${h.m} · ${h.ty} · ${h.role}</small></div><button class="icon" data-close aria-label="Close">${svg(IC.x)}</button></div><div class="sgrid"><div><div class="sec"><h4>Why we own it</h4><p>${esc(h.th)}</p></div><div class="sec"><h4>Rotate if</h4><div class="warnbox">${esc(h.rot)}</div></div><div class="sec" style="margin-bottom:0"><h4>Score ${h.s.toFixed(2)} · set ${esc(PLAN.asOf)}</h4>${h.f.map((v,i)=>`<div class="fb">${PLAN.F[i]}<span><i style="width:${v*20}%"></i></span><em>${v}</em></div>`).join('')}</div></div><div class="nums">${nums.map(n=>`<div><span>${n[0]}</span><b>${esc(n[1])}</b></div>`).join('')}</div></div>`)}
function closePop(){$('#pop').classList.remove('on')}
$('#bell').onclick=e=>{e.stopPropagation();renderSignals();$('#pop').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#pop')&&!e.target.closest('#bell'))closePop()});
function signals(){const k=K(),out=[],n=Date.now();if(S.err)out.push(['bad','Could not read positions','Retrying automatically.']);held().forEach(h=>{const c=calc(h),f=S.fund[h.m];if(c.lev&&c.lev.value>1)out.push(['bad',`${h.t} is at ${c.lev.value}x`,'The portfolio runs at 1x isolated.',h.t]);if(num(f)&&f>30)out.push(['bad',`${h.t} funding ${f.toFixed(0)}% APR`,'Above the 30% rule.',h.t]);else if(num(f)&&f>15)out.push(['warn',`${h.t} funding ${f.toFixed(0)}% APR`,'Above the 15% watch level.',h.t]);const w=chgN(h.m,7);if(num(w)&&w<-25)out.push(['bad',`${h.t} ${fpct(w,1)} in 7 days`,'Re-score if the cause is company-specific.',h.t]);if(k.value&&c.val/k.value>.2)out.push(['warn',`${h.t} is ${(c.val/k.value*100).toFixed(0)}% of the book`,'Concentration review.',h.t])});if(k.value&&k.ai/k.value>.65)out.push(['warn',`AI is ${(k.ai/k.value*100).toFixed(0)}% of the book`,'Concentration review.']);PLAN.cats.forEach(c=>{const d=(evTime(c)-n)/864e5;if(d>0&&d<=5)out.push([c[5]?'warn':'',`${c[2]} in ${d<1?'under a day':Math.ceil(d)+' days'}`,c[3]])});return out}
function renderSignals(){const s=signals(),attn=s.filter(x=>x[0]==='bad'||x[0]==='warn').length,cnt=$('#count');cnt.hidden=!attn;cnt.textContent=attn;$('#pop').innerHTML=s.map(o=>`<${o[3]?'button':'div'} class="sg ${o[0]}" ${o[3]?`data-t="${o[3]}"`:''}><i></i><div><b>${esc(o[1])}</b><span>${esc(o[2])}</span></div></${o[3]?'button':'div'}>`).join('')||'<div class="sg ok"><i></i><div><b>All clear</b><span>No rules triggered.</span></div></div>'}
$('#pop').onclick=e=>{const b=e.target.closest('[data-t]');if(b){S.sel=b.dataset.t;closePop();go('home')}};
$('#gear').onclick=()=>{openSheet(`<div class="shead"><div><h3>Settings</h3><small>Read-only. Oazy Research reads public market data and can't trade or move funds.</small></div><button class="icon" data-close aria-label="Close">${svg(IC.x)}</button></div><div class="sec"><h4>Tracked address</h4><input class="field" id="adI" value="${esc(S.address)}" spellcheck="false" aria-label="Tracked address"></div><p class="mu" style="font-size:13px">Performance counts only the portfolio's own positions, from ${startLabel}.</p><div class="row"><a class="btn gh" href="https://app.hyperliquid.xyz/explorer/address/${esc(S.address)}" target="_blank" rel="noopener">Explorer</a><button class="btn pri" id="adS">Save</button></div>`);$('#adS').onclick=()=>{const v=$('#adI').value.trim();if(!/^0x[a-fA-F0-9]{40}$/.test(v)){toast("That isn't a valid address");return}const ch=v.toLowerCase()!==S.address.toLowerCase();S.address=v;LS.set('addr',v);closeSheet();if(ch){S.pos={};S.loaded=false;S.curve={};structure();pollPos().then(()=>background());if(wsObj)try{wsObj.close()}catch{}}}};

/* ── Live values ─────────────────────────────────────────────────────────── */
const fmt={px:h=>[fpx(P(h)),''],ch:h=>{const v=ch24(h.m);return[fpct(v),cls(v)]},val:h=>{const c=calc(h);return[c?fusd(c.val):'—','']},share:h=>{const k=K(),c=calc(h);return[c&&k.value?(c.val/k.value*100).toFixed(1)+'%':'—','']},tot:h=>{const c=calc(h);return[c?fsgn(c.total):'—',c?cls(c.total):'mu']},pc:h=>{const c=calc(h);return[c?fpct(c.pct):'—',c?cls(c.pct):'mu']},tchg:h=>{const v=ch24(h.m);return[num(v)?fpct(v,1):'',cls(v)]}};
function coreVal(f,k){if(!k.ready)return['—','mu'];return{value:[fusd(k.value),''],total:[fsgn(k.total),cls(k.total)],ret:[fpct(k.ret),cls(k.ret)],sp:[num(k.sp)?fpct(k.ret-k.sp):'—',num(k.sp)?cls(k.ret-k.sp):'mu'],nd:[num(k.nd)?fpct(k.ret-k.nd):'—',num(k.nd)?cls(k.ret-k.nd):'mu'],tchg:[fpct(k.ret,1),cls(k.ret)]}[f]||['—','mu']}
function live(){const k=K();$$('[data-lv]').forEach(e=>{const[t,f]=e.dataset.lv.split('|');let r;if(t==='CORE')r=coreVal(f,k);else{const h=byT[t];if(!h||!fmt[f])return;r=fmt[f](h)}if(e.textContent!==r[0]){const was=parseFloat(e.textContent.replace('−','-').replace(/[^\d.-]/g,''));e.textContent=r[0];const now=parseFloat(r[0].replace('−','-').replace(/[^\d.-]/g,''));if(!calm&&was===was&&now!==was&&e.closest('#stats,#title'))e.animate([{textShadow:'0 0 20px rgba('+(now>was?UPC:DNC)+',.95)'},{textShadow:'0 0 0 rgba(0,0,0,0)'}],{duration:800,easing:'ease-out'})}e.classList.remove('up','dn','mu');if(r[1])e.classList.add(r[1])});if(S.page==='perf'){const a=$('#perfRet'),s=(el,v,txt)=>{el.textContent=txt;el.className=cls(v)};if(k.ready){s(a,k.ret,fpct(k.ret));s($('#perfPL'),k.total,fsgn(k.total));s($('#perfSP'),k.ret-k.sp,num(k.sp)?fpct(k.ret-k.sp):'—');s($('#perfND'),k.ret-k.nd,num(k.nd)?fpct(k.ret-k.nd):'—')}}setStatus()}
/* Rebuild whatever depends on which positions exist. */
function structure(){if(S.sel!=='CORE'&&!S.pos[byT[S.sel]?.m])S.sel='CORE';buildRail();if(S.page==='home')renderInfo();if(S.page==='hold')renderHold();if(S.page==='perf')renderPerf();renderSignals();drawHero()}

/* ── Keyboard, resize, boot ──────────────────────────────────────────────── */
addEventListener('keydown',e=>{const typing=/INPUT/.test(document.activeElement.tagName);if(e.key==='Escape'){if(closeSheet())return;closePop();if(typing)document.activeElement.blur();return}if($('#ov').classList.contains('on')||typing)return;if(e.key==='Tab'){e.preventDefault();const i=PAGES.findIndex(p=>p[0]===S.page);go(PAGES[(i+(e.shiftKey?-1:1)+PAGES.length)%PAGES.length][0]);return}if(/^[1-5]$/.test(e.key)){go(PAGES[+e.key-1][0]);return}if(S.page==='hold'&&e.key==='/'){e.preventDefault();$('#q').focus();return}if(S.page==='home'){if(e.key==='ArrowRight'){e.preventDefault();step(1)}else if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}else if(e.key==='Enter'&&document.activeElement===document.body){e.preventDefault();if(S.sel==='CORE')go('perf');else details(S.sel)}}});
document.addEventListener('pointerup',e=>{const b=e.target.closest&&e.target.closest('button');if(b)setTimeout(()=>{if(document.activeElement===b)b.blur()})});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{movePill();layoutRail();paintHero();drawPerf();if(S.page==='perf')renderPerf()},100)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(movePill);
function bootDone(){setTimeout(()=>{document.body.classList.add('ready');setTimeout(()=>{const b=$('#boot');if(b)b.remove()},1100)},Math.max(0,850-performance.now()))}setTimeout(bootDone,2600);
tickClock();setInterval(tickClock,5000);
{const h=location.hash.slice(1);go(PAGES.some(p=>p[0]===h)?h:'home')}
(async()=>{connectWS();for(let i=0;i<4;i++){try{await loadMeta();break}catch{await wait(3000)}}await pollPos();bootDone();background();
 setInterval(()=>{if(!document.hidden){live();tickCD()}},1000);setInterval(()=>pollPos(),30000);setInterval(()=>loadMeta().catch(()=>{}),90000);setInterval(()=>{if(!document.hidden){paintHero();drawPerf()}},3000);if(window.ResizeObserver){let ro;new ResizeObserver(()=>{cancelAnimationFrame(ro);ro=requestAnimationFrame(()=>{paintHero();drawPerf()})}).observe($('#heroWrap'))}setInterval(()=>loadCurve().catch(()=>{}),300000);setInterval(()=>{if(S.page==='home'&&S.sel!=='CORE')drawHero()},60000);setInterval(()=>{if(S.page==='perf'&&!document.hidden){renderMovers(K());live()}},5000);setInterval(renderSignals,60000)})();
</script>
</body>
