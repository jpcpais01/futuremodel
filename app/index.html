<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src https: ; worker-src 'none'">
<title>Oazy Research</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="sky"></canvas>
<div id="boot" aria-hidden="true"><img src="icon.png" alt=""><div><b>OAZY</b><i>RESEARCH</i></div></div>

<header id="top">
  <div class="brand"><img src="icon.png" alt=""><b>OAZY</b><i>RESEARCH</i><small id="ver"></small></div>
  <nav class="tabs" id="tabs" aria-label="Pages"><span class="pill" id="pill"></span></nav>
  <div class="grow"></div>
  <button class="status" id="status" title="Open the council's folder on GitHub"><i id="dot"></i><span id="statusT">Loading</span></button>
  <button class="icon" id="gear" aria-label="Settings"></button>
  <div class="sep win-only"></div>
  <button class="icon win" id="wMin" aria-label="Minimize"></button>
  <button class="icon win" id="wMax" aria-label="Full screen"></button>
  <button class="icon win x" id="wClose" aria-label="Close"></button>
</header>

<main id="pages">
  <section class="page" id="p-home" data-title="Overview"></section>
  <section class="page" id="p-hold" data-title="Holdings"></section>
  <section class="page" id="p-council" data-title="Council"></section>
  <section class="page" id="p-meet" data-title="Meetings"></section>
</main>

<nav id="dock" aria-label="Pages"></nav>

<!-- The council's presentation: a full-screen show, live or replayed. -->
<div id="show" aria-hidden="true">
  <canvas id="showC"></canvas>
  <div class="sh-top">
    <div class="sh-act"><span class="kick" id="shKick"></span><b id="shTitle"></b></div>
    <div class="sh-prog" id="shProg"></div>
    <div class="sh-ctl">
      <span class="sh-cost" id="shCost"></span>
      <button class="chip" id="shSpeed" title="Presentation speed">1×</button>
      <button class="chip" id="shSkip">Skip ahead</button>
      <button class="icon" id="shClose" aria-label="Close"></button>
    </div>
  </div>
  <div class="sh-wall" id="shWall"></div>
  <div class="sh-cap" id="shCap"></div>
  <div class="sh-side" id="shSide"></div>
  <div class="sh-think" id="shThink"></div>
  <div class="sh-final" id="shFinal"></div>
  <div class="sh-card" id="shCard"></div>
  <div class="sh-flash" id="shFlash"></div>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="tip" id="tip"></div>
<div id="toast" role="status"></div>
<script src="brand.js"></script>
<script src="kit.js"></script>
<script src="engine.js"></script>
<script src="host.js"></script>
<script src="avatars.js"></script>
<script src="show.js"></script>
<script src="app.js"></script>
</body>
</html>
