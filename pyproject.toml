[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futuremodel"
version = "0.1.0"
description = "QQQ 10:30-to-close day-trading model: regime-gated specialists pretrained across a liquid universe, built only on free data."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "yfinance>=0.2.40",
  "pyarrow>=12",
  "requests>=2.28",
  "matplotlib>=3.7",
  "joblib>=1.2",
  "tabulate>=0.9",
]

[project.optional-dependencies]
news = ["feedparser>=6.0", "xlrd>=2.0"]
llm = ["transformers>=4.40", "torch>=2.1", "accelerate>=0.30"]
dev = ["pytest>=7"]

[project.scripts]
fm = "futuremodel.cli:main"

[tool.setuptools.packages.find]
include = ["futuremodel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
